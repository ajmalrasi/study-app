<!doctype html>
<html lang="en" data-theme="system" data-reading="standard">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#30664e" />
    <meta
      name="description"
      content="Your course notes, transcripts, drawings, and daily review in one quiet study space."
    />
    <title>Study Notes</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <script>
      try {
        const p = JSON.parse(localStorage.getItem("sn-preferences") || "{}");
        document.documentElement.dataset.theme = p.theme || "system";
        document.documentElement.dataset.reading = p.reading || "standard";
      } catch {}
    </script>
    <link rel="stylesheet" href="/assets/app.css?v=1" />
    <script type="module" src="/assets/app.js?v=1"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Main navigation">
        <a href="#" class="brand"
          ><span class="brand-mark"
            ><svg class="icon" aria-hidden="true">
              <use href="/assets/icons.svg#book"></use></svg></span
          >study notes</a
        >
        <nav class="primary-nav" aria-label="Workspace">
          <a href="#" data-nav="overview"
            ><svg class="icon" aria-hidden="true">
              <use href="/assets/icons.svg#home"></use></svg
            >Overview</a
          >
          <a href="#library" data-nav="library"
            ><svg class="icon" aria-hidden="true">
              <use href="/assets/icons.svg#library"></use></svg
            >Library<span id="library-count" class="count" hidden></span
          ></a>
          <a href="#review" data-nav="review"
            ><svg class="icon" aria-hidden="true">
              <use href="/assets/icons.svg#layers"></use></svg
            >Review<span data-due-count class="count" hidden></span
          ></a>
          <a href="#ask" data-nav="ask"
            ><svg class="icon" aria-hidden="true">
              <use href="/assets/icons.svg#sparkles"></use></svg
            >Ask your notes</a
          >
        </nav>
        <div class="course-nav">
          <div class="eyebrow">Your courses</div>
          <nav id="course-navigation" aria-label="Courses">
            <p class="small muted">Loading your library…</p>
          </nav>
        </div>
        <div class="sidebar-footer">
          <p>A space to understand,<br />and remember.</p>
          <button class="text-button" data-action="preferences">
            <svg class="icon" aria-hidden="true">
              <use href="/assets/icons.svg#sun"></use></svg
            >Reading & appearance
          </button>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <button
            id="menu-toggle"
            class="icon-button menu-toggle"
            data-action="menu"
            aria-label="Open course navigation"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <svg class="icon" aria-hidden="true">
              <use href="/assets/icons.svg#menu"></use>
            </svg>
          </button>
          <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb">
            <a href="#">Study space</a>
          </nav>
          <div class="topbar-actions">
            <a
              class="icon-button"
              href="#search"
              aria-label="Search your library"
              ><svg class="icon" aria-hidden="true">
                <use href="/assets/icons.svg#search"></use></svg></a
            ><button
              class="icon-button"
              data-action="preferences"
              aria-label="Reading and appearance settings"
            >
              <svg class="icon" aria-hidden="true">
                <use href="/assets/icons.svg#sun"></use>
              </svg>
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1">
          <div class="loading" role="status">Opening your study space…</div>
        </main>
        <nav class="mobile-nav" aria-label="Workspace">
          <a href="#" data-nav="overview"
            ><svg class="icon" aria-hidden="true">
              <use href="/assets/icons.svg#home"></use></svg
            >Home</a
          ><a href="#library" data-nav="library"
            ><svg class="icon" aria-hidden="true">
              <use href="/assets/icons.svg#library"></use></svg
            >Library</a
          ><a href="#review" data-nav="review"
            ><svg class="icon" aria-hidden="true">
              <use href="/assets/icons.svg#layers"></use></svg
            >Review<span data-due-count class="mobile-count" hidden></span></a
          ><a href="#ask" data-nav="ask"
            ><svg class="icon" aria-hidden="true">
              <use href="/assets/icons.svg#sparkles"></use></svg
            >Ask</a
          >
        </nav>
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button
          class="icon-button"
          data-action="close-dialog"
          aria-label="Close dialog"
        >
          <svg class="icon" aria-hidden="true">
            <use href="/assets/icons.svg#close"></use>
          </svg>
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
    <noscript
      >This study space needs JavaScript. Your Markdown exports remain available
      through the server.</noscript
    >
  </body>
</html>
